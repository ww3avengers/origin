<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#171717" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark light" />
    <!-- Performance: preconnect to critical origins (fonts/CDNs) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Optional: add more if used, e.g. GTM/CDN
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    -->
    <title>SIGMACODE AI</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
    </style>
    <!-- Structured Data (JSON-LD) injected dynamically to avoid hardcoded brand/domain -->
    <script>
      (function () {
        try {
          var name = document.title || 'Website';
          var url = location.origin;
          var logo = url + '/assets/favicon.svg';
          var data = [
            {
              "@context": "https://schema.org",
              "@type": "Organization",
              "name": name,
              "url": url,
              "logo": logo
            },
            {
              "@context": "https://schema.org",
              "@type": "WebSite",
              "name": name,
              "url": url,
              "inLanguage": document.documentElement.lang || 'de-DE',
              "potentialAction": {
                "@type": "SearchAction",
                "target": url + "/search?q={search_term_string}",
                "query-input": "required name=search_term_string"
              }
            }
          ];
          var s = document.createElement('script');
          s.type = 'application/ld+json';
          s.text = JSON.stringify(data);
          document.head.appendChild(s);
        } catch (e) {
          // no-op
        }
      })();
    </script>
    <script>
      const theme = localStorage.getItem('color-theme');
      const loadingContainerStyle = document.createElement('style');
      let backgroundColor;

      if (theme === 'dark') {
        backgroundColor = '#0d0d0d';
      } else if (theme === 'light') {
        backgroundColor = '#ffffff';
      } else if (theme === 'system') {
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
        backgroundColor = prefersDarkScheme ? '#0d0d0d' : '#ffffff';
      } else {
        backgroundColor = '#ffffff';
      }

      loadingContainerStyle.innerHTML = `
        #loading-container {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: ${backgroundColor};
        }
      `;
      document.head.appendChild(loadingContainerStyle);
    </script>
    <script defer type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root">
      <div id="loading-container"></div>
    </div>
  </body>
</html>
