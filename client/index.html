<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="theme-color" content="#171717" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="SIGMACODE AI – Innovative KI-Lösungen für Unternehmen. Chatbots, autonome Agenten und maßgeschneiderte AI-Services." />
    <meta name="color-scheme" content="dark light" />
    <title>SIGMACODE AI</title>
    <link rel="shortcut icon" href="#" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://sigmacode.ai/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SIGMACODE AI" />
    <meta property="og:title" content="SIGMACODE AI – Innovative KI-Lösungen" />
    <meta property="og:description" content="Entdecken Sie die Zukunft der künstlichen Intelligenz mit maßgeschneiderten Lösungen, Chatbots und autonomen Agenten." />
    <meta property="og:image" content="/assets/unify.webp" />
    <meta property="og:url" content="https://sigmacode.ai/" />
    <meta property="og:locale" content="de_DE" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SIGMACODE AI – Innovative KI-Lösungen" />
    <meta name="twitter:description" content="Entdecken Sie maßgeschneiderte AI-Lösungen, Chatbots und autonome Agenten für Ihr Unternehmen." />
    <meta name="twitter:image" content="/assets/unify.webp" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
    </style>
    <script>
      const theme = localStorage.getItem('color-theme');
      const loadingContainerStyle = document.createElement('style');
      let backgroundColor;

      if (theme === 'dark') {
        backgroundColor = '#0d0d0d';
      } else if (theme === 'light') {
        backgroundColor = '#ffffff';
      } else if (theme === 'system') {
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
        backgroundColor = prefersDarkScheme ? '#0d0d0d' : '#ffffff';
      } else {
        backgroundColor = '#ffffff';
      }

      loadingContainerStyle.innerHTML = `
        #loading-container {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: ${backgroundColor};
        }
      `;
      document.head.appendChild(loadingContainerStyle);
    </script>
    <script defer type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root">
      <div id="loading-container"></div>
    </div>
  </body>
</html>
